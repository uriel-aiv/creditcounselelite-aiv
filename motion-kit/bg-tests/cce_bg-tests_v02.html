<header>
  <h1>CCE background tests, v02</h1>
  <p>Code-drawn imitations of the brand guide's cover: twisted light ribbons made of fine lines, dot meshes lying on the ribbon surfaces. Each panel is a pure function of time. The top half is where the motion panel sits in the split-screen.</p>

<script>
const TAU = Math.PI * 2, DW = 1080, DH = 1920;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fr = (x) => x - Math.floor(x);
const rnd = (i) => fr(Math.sin(i * 12.9898 + 78.233) * 43758.5453);

// cubic bezier in design space
function bz(P, s) { const q = 1 - s; return [q*q*q*P[0][0] + 3*q*q*s*P[1][0] + 3*q*s*s*P[2][0] + s*s*s*P[3][0], q*q*q*P[0][1] + 3*q*q*s*P[1][1] + 3*q*s*s*P[2][1] + s*s*s*P[3][1]]; }
function bzd(P, s) { const q = 1 - s; return [3*q*q*(P[1][0]-P[0][0]) + 6*q*s*(P[2][0]-P[1][0]) + 3*s*s*(P[3][0]-P[2][0]), 3*q*q*(P[1][1]-P[0][1]) + 6*q*s*(P[2][1]-P[1][1]) + 3*s*s*(P[3][1]-P[2][1])]; }
const toPx = (P) => P.map(([x, y]) => [x * DW, y * DH]);

// A twisted ribbon: centre curve C(s), half-width w(s), twist angle th(s).
// Point at (s, v), v in [-1, 1]: C + N * w * v * cos(th) ; depth = sin(th) * v (for dot size / brightness).
function ribbonPt(R, s, v, t) {
  const C = bz(R.P, s), D = bzd(R.P, s), d = Math.hypot(D[0], D[1]) || 1, N = [-D[1] / d, D[0] / d];
  const w = R.w * DW * (0.35 + 0.65 * Math.sin(Math.PI * clamp(s * 1.05))) * (1 + 0.08 * Math.sin(t * 0.3 + s * 4));
  const th = R.tw0 + R.tw * s + t * R.spin;
  const c = Math.cos(th), sn = Math.sin(th);
  return [C[0] + N[0] * w * v * c, C[1] + N[1] * w * v * c, sn * v, Math.abs(c)];
}
function drawLines(ctx, R, t, { n = 64, steps = 90, alpha = 0.22, col = [70, 130, 255], hi = [190, 215, 255], width = 1.1 } = {}) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = width;
  for (let i = 0; i <= n; i++) {
    const v = -1 + 2 * i / n, edge = Math.pow(Math.abs(v), 6);
    const k = 0.5 + 0.5 * v, c = [0, 1, 2].map((j) => Math.round(lerp(col[j], hi[j], k * 0.7 + edge * 0.3)));
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha * (0.45 + 0.55 * edge + 0.25 * rnd(i + R.seed))})`;
    ctx.beginPath();
    for (let j = 0; j <= steps; j++) { const s = j / steps, p = ribbonPt(R, s, v, t), fade = Math.sin(Math.PI * s); if (j === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawDots(ctx, R, t, { nu = 120, nv = 26, size = 3.2, alpha = 0.85, from = 0, to = 1 } = {}) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let j = 0; j <= nu; j++) for (let i = 0; i <= nv; i++) {
    const s = lerp(from, to, j / nu), v = -1 + 2 * i / nv, p = ribbonPt(R, s, v, t);
    const depth = 0.5 + 0.5 * p[2], fade = Math.sin(Math.PI * (j / nu)) * (1 - Math.pow(Math.abs(v), 4));
    const a = alpha * fade * (0.25 + 0.75 * depth), z = size * (0.45 + 0.75 * depth);
    if (a < 0.03) continue;
    ctx.fillStyle = `rgba(${Math.round(lerp(90, 225, depth))},${Math.round(lerp(140, 235, depth))},255,${a})`;
    ctx.fillRect(p[0] - z / 2, p[1] - z / 2, z, z);
  }
  ctx.restore();
}
function core(ctx, P, t, { w = 3, glow = 26, from = 0, to = 1 } = {}) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const pts = []; for (let j = 0; j <= 120; j++) { const s = lerp(from, to, j / 120); pts.push(bz(P, s)); }
  const pass = (lw, col, blur) => { ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.stroke(); };
  pass(w * 5, 'rgba(40,110,255,0.25)', glow * 1.6); pass(w * 2, 'rgba(150,195,255,0.55)', glow); pass(w * 0.8, 'rgba(255,255,255,0.95)', glow * 0.4);
  // a soft travelling glint along the core
  const g = fr(t * 0.08), gp = bz(P, lerp(from, to, g)), gr = ctx.createRadialGradient(gp[0], gp[1], 0, gp[0], gp[1], 70);
  gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(80,140,255,0)'); ctx.shadowBlur = 0; ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(gp[0], gp[1], 70, 0, TAU); ctx.fill();
  ctx.restore();
}
function base(ctx, glowAt = [0.55, 0.62], glowR = 1.0) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, DW, DH);
  const g = ctx.createRadialGradient(glowAt[0] * DW, glowAt[1] * DH, 40, glowAt[0] * DW, glowAt[1] * DH, DH * 0.7 * glowR);
  g.addColorStop(0, 'rgba(0,60,170,0.55)'); g.addColorStop(0.5, 'rgba(0,30,95,0.28)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, DW, DH);
}
// soft drift so every curve breathes (pure function of t)
const drift = (P, t, amp = 0.015, seed = 1) => P.map(([x, y], i) => [x + amp * Math.sin(t * 0.21 + i * 1.7 + seed), y + amp * Math.cos(t * 0.17 + i * 2.3 + seed)]);

// ------------------------------------------------------------------ variants
// sheet = many fine lines (additive) + a faint wide pass so the lines merge into a glowing surface
function sheet(ctx, R, t, o = {}) {
  drawLines(ctx, R, t, { n: o.n || 110, alpha: (o.alpha || 0.2) * 0.55, width: 9, col: [10, 60, 200], hi: [60, 120, 255] });
  drawLines(ctx, R, t, { n: o.n || 110, alpha: o.alpha || 0.2, width: 1.2, col: [40, 100, 255], hi: [180, 210, 255] });
}
const VARIANTS = [
  { name: 'A · Cover', note: 'Closest to the guide: a wide sheet sweeping across, a dotted dome curling up to the top right.',
    draw(ctx, t) {
      base(ctx, [0.55, 0.62], 1.1);
      const L = { P: toPx(drift([[-0.35, 0.42], [0.15, 0.6], [0.55, 0.8], [1.35, 0.66]], t, 0.012, 1)), w: 0.34, tw0: 0.6, tw: 2.6, spin: 0.05, seed: 1 };
      const D = { P: toPx(drift([[0.22, 0.98], [0.28, 0.3], [0.98, 0.02], [0.96, 0.62]], t, 0.012, 4)), w: 0.36, tw0: 1.25, tw: 1.6, spin: -0.035, seed: 2 };
      const B = { P: toPx(drift([[0.1, 1.15], [0.55, 0.78], [0.85, 0.72], [1.35, 0.62]], t, 0.01, 7)), w: 0.3, tw0: 2.0, tw: 2.4, spin: 0.04, seed: 3 };
      sheet(ctx, L, t, { alpha: 0.22 });
      sheet(ctx, B, t, { alpha: 0.18 });
      drawDots(ctx, D, t, { nu: 95, nv: 30, size: 5.5, alpha: 0.85, from: 0.04, to: 0.98 });
      sheet(ctx, D, t, { alpha: 0.1, n: 70 });
      drawDots(ctx, B, t, { nu: 80, nv: 24, size: 4.6, alpha: 0.55, from: 0.2, to: 1 });
    } },
  { name: 'B · Low sweep', note: 'Same language, kept to the lower half so the motion area stays dark and readable. One sheet, one dot band.',
    draw(ctx, t) {
      base(ctx, [0.5, 0.6], 0.8);
      const R1 = { P: toPx(drift([[-0.35, 0.3], [0.2, 0.55], [0.65, 0.36], [1.35, 0.5]], t, 0.012, 2)), w: 0.26, tw0: 0.2, tw: 2.6, spin: 0.05, seed: 4 };
      const R2 = { P: toPx(drift([[-0.3, 0.6], [0.35, 0.32], [0.75, 0.62], [1.3, 0.28]], t, 0.01, 5)), w: 0.22, tw0: 1.4, tw: 2.2, spin: -0.05, seed: 5 };
      sheet(ctx, R1, t, { alpha: 0.2 });
      drawDots(ctx, R2, t, { nu: 95, nv: 20, size: 5, alpha: 0.75 });
      sheet(ctx, R2, t, { alpha: 0.08, n: 60 });
    } },
  { name: 'C · Dot dome', note: 'The dotted surface on its own, turning slowly, with faint line sheets behind it. Most texture, least light.',
    draw(ctx, t) {
      base(ctx, [0.65, 0.42], 1.0);
      const D = { P: toPx(drift([[0.0, 1.05], [0.15, 0.25], [1.1, -0.08], [0.98, 0.62]], t, 0.014, 3)), w: 0.45, tw0: 1.0, tw: 1.5, spin: 0.03, seed: 6 };
      const R1 = { P: toPx(drift([[-0.3, 0.75], [0.3, 0.55], [0.7, 0.8], [1.3, 0.6]], t, 0.01, 8)), w: 0.24, tw0: 0.5, tw: 2.6, spin: -0.04, seed: 7 };
      sheet(ctx, R1, t, { alpha: 0.14 });
      sheet(ctx, D, t, { alpha: 0.06, n: 60 });
      drawDots(ctx, D, t, { nu: 110, nv: 40, size: 5.5, alpha: 0.9, from: 0.04, to: 0.98 });
    } },
  { name: 'D · Light lines', note: 'Only the fine line sheets, no dots. Cleanest, closest to the cover\'s left side.',
    draw(ctx, t) {
      base(ctx, [0.35, 0.65], 1.0);
      const R1 = { P: toPx(drift([[-0.35, 0.25], [0.25, 0.95], [0.6, 0.45], [1.35, 0.85]], t, 0.012, 1)), w: 0.32, tw0: 0.3, tw: 2.8, spin: 0.05, seed: 8 };
      const R2 = { P: toPx(drift([[-0.3, 1.0], [0.25, 0.4], [0.75, 0.3], [1.3, 0.02]], t, 0.012, 3)), w: 0.24, tw0: 1.1, tw: 2.4, spin: -0.045, seed: 9 };
      sheet(ctx, R1, t, { alpha: 0.24, n: 130 });
      sheet(ctx, R2, t, { alpha: 0.2, n: 110 });
    } },
];

// ------------------------------------------------------------------ page
const grid = document.getElementById('grid'), cvs = [];
const ref = document.createElement('figure'); ref.className = 'ref';
ref.innerHTML = '<img id="refimg" alt="Brand guide cover background"><figcaption><b>Reference · Brand guide cover</b><span>The original background, for comparison.</span></figcaption>';
grid.appendChild(ref);
for (const v of VARIANTS) {
  const f = document.createElement('figure'), c = document.createElement('canvas'); c.width = 540; c.height = 960;
  f.appendChild(c); const cap = document.createElement('figcaption'); cap.innerHTML = `<b>${v.name}</b><span>${v.note}</span>`; f.appendChild(cap); grid.appendChild(f); cvs.push([c, v]);
}
const REF = document.getElementById('refimg'); REF.src = window.REF_SRC || '';
let playing = true, T = 0, last = performance.now();
const scrub = document.getElementById('scrub'), tl = document.getElementById('tl'), split = document.getElementById('split'), dim = document.getElementById('dim');
document.getElementById('play').onclick = (e) => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
scrub.oninput = () => { T = +scrub.value; render(); };
function render() {
  for (const [c, v] of cvs) {
    const ctx = c.getContext('2d'); ctx.setTransform(c.width / DW, 0, 0, c.height / DH, 0, 0);
    v.draw(ctx, T);
    if (dim.checked) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, DW, DH); }
    if (split.checked) { ctx.fillStyle = '#2a2420'; ctx.fillRect(0, 980, DW, DH - 980); ctx.fillStyle = '#5a4c40'; ctx.font = '600 44px system-ui'; ctx.textAlign = 'center'; ctx.fillText('founder', DW / 2, 1450); }
  }
  tl.textContent = T.toFixed(2) + ' s'; scrub.value = T;
}
window.seek = (t) => { T = t; render(); };
function loop(now) { if (playing) { T = (T + (now - last) / 1000) % 59; render(); } last = now; requestAnimationFrame(loop); }
render(); requestAnimationFrame(loop);
</script>
</body>
</html>
